
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Maheku ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ff4d6d, #ff99ac);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      animation: glow 2s infinite alternate;
    }

    p {
      font-size: 1.3rem;
      max-width: 500px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px white; }
      to { text-shadow: 0 0 25px pink; }
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 20px;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh); opacity: 1; }
      100% { transform: translateY(110vh); opacity: 0; }
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #ff2d55;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<h1>Happy Valentine’s Day Maheku ❤️</h1>
<p>
  Maheku meri jaan...  
  Tu meri life ka sabse beautiful part hai 😘  
  I love you so much 💖
</p>

<button onclick="playMusic()">Click for Surprise 🎶</button>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>
  function playMusic() {
    document.getElementById("music").play();
    alert("I Love You Maheku ❤️");
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 30 + 15 + "px";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }

  setInterval(createHeart, 200);
</script>

</body>
</html>
